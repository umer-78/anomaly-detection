name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: The sample data regenerates identically
        run: |
          python tools/make_data.py
          git diff --exit-code data/
      - name: Evaluate end to end
        run: |
          anomaly describe
          anomaly evaluate
          anomaly detect --detector seasonal --limit 5
